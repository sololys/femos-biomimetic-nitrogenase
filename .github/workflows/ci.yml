name: Biomimetic Nitrogenase CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy

    - name: Run Biomimetic Realization Engine (femos_quantum_biomimetic_engine.py)
      run: |
        python femos_quantum_biomimetic_engine.py

    - name: Run Spor 1 (pcet_mossbauer_quantum_chemistry.py)
      run: |
        python pcet_mossbauer_quantum_chemistry.py

    - name: Run Spor 2 (qsa_gain_scheduler_control.py)
      run: |
        python qsa_gain_scheduler_control.py

    - name: Run Fe-Mo Metamorphosis Engine (femos_metamorphosis_engine.py)
      run: |
        python femos_metamorphosis_engine.py

    - name: Run Metaprotocol Transition Runtime (metamorphosis_runtime.py)
      run: |
        python metamorphosis_runtime.py

    - name: Run H2-VESTA Digital Twin Simulator (h2v_twin.py)
      run: |
        python h2v_twin.py

    - name: Run Morph Integration Suite (femos_morph_integration_suite.py)
      run: |
        python femos_morph_integration_suite.py

    - name: Run Classical APC Simulator (apc_simulator.py)
      run: |
        python apc_simulator.py

    - name: Run Quantum APC Path Asymmetry Test (apc_qiskit_sim.py)
      run: |
        python apc_qiskit_sim.py

    - name: Run APC-G4 Metamorphosis Engine (apc_g4_metamorphosis_engine.py)
      run: |
        python apc_g4_metamorphosis_engine.py

    - name: Run QCS OMNI Metamorphosis Engine (qcs_omni_metamorphosis_engine.py)
      run: |
        python qcs_omni_metamorphosis_engine.py

    - name: Run Rosetta Trit Compiler (rosetta_trit_compiler.py)
      run: |
        python rosetta_trit_compiler.py

    - name: Run Rosetta Metamorphosis Engine (rosetta_metamorphosis_engine.py)
      run: |
        python rosetta_metamorphosis_engine.py

    - name: Run Omega Rosetta Visualizer (omega_rosetta.py)
      run: |
        python omega_rosetta.py --once

    - name: Run Arkitektens Nullpunkt Engine (arkitektens_nullpunkt_engine.py)
      run: |
        python arkitektens_nullpunkt_engine.py

    - name: Run ETOR2 Hardware Latch Engine (etor_v2_engine.py)
      run: |
        python etor_v2_engine.py

    - name: Run ETOR2 Metamorphosis Engine (etor2_metamorphosis_engine.py)
      run: |
        python etor2_metamorphosis_engine.py

    - name: Run OMNI Core Loop (omni_core.py)
      run: |
        python omni_core.py

    - name: Run OMNI Full Metamorphosis Engine (omni_full_metamorphosis_engine.py)
      run: |
        python omni_full_metamorphosis_engine.py

    - name: Run IKS Pure Inversion Node (iks_pure_inversion_node.py)
      run: |
        python iks_pure_inversion_node.py

    - name: Run IKS Reversible Metamorphosis Engine (iks_reversible_metamorphosis_engine.py)
      run: |
        python iks_reversible_metamorphosis_engine.py

    - name: Run Atlas Holomorphic Runtime (atlas_holomorphic.py)
      run: |
        python atlas_holomorphic.py

    - name: Run Holomorphic Holographic Metamorphosis Engine (holomorphic_holographic_metamorphosis_engine.py)
      run: |
        python holomorphic_holographic_metamorphosis_engine.py

    - name: Run GKO Engine (gko_engine.py)
      run: |
        python gko_engine.py

    - name: Run GKO-OS 3.0 Metamorphosis Engine (gko_os3_metamorphosis_engine.py)
      run: |
        python gko_os3_metamorphosis_engine.py

    - name: Verify HTML Workbench Integrity
      run: |
        test -f femos_quantum_biomimetic_workbench.html && echo "HTML Workbench verified!"
