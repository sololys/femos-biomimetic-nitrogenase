name: Fe-Mo-S Validation CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  validate-protocol:
    name: Run Fe-Mo-S Deterministic Protocol Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute PROTOKOLL Fe-Mo-S 10-Candidate Validation Suite
        run: |
          python3 femos_engine.py
