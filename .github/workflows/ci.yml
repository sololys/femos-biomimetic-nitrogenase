name: Fe-Mo-S Validation CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  validate-protocol:
    name: Run Fe-Mo-S Deterministic Protocol & Hostile Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run PROTOKOLL Fe-Mo-S 10-Candidate Golden Suite
        run: |
          python3 femos_engine.py

      - name: Run Adversarial & Hostile Input Regression Suite (30 Fail-Closed Tests)
        run: |
          python3 test_femos_hostile_inputs.py
