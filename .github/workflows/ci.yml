name: Biomimetic Nitrogenase CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy

    - name: Run Master Metamorphosis Engines Sweep (master_all_engines_sweep.py)
      run: |
        python master_all_engines_sweep.py

    - name: Verify HTML Workbench Integrity
      run: |
        test -f femos_quantum_biomimetic_workbench.html && echo "HTML Workbench verified!"
